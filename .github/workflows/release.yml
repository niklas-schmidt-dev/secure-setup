name: release

on:
  push:
    tags: ["v*"]

# Everything that runs in this workflow can write releases, so every action
# and tool is pinned to an exact commit or version.
permissions:
  contents: write # create the release
  id-token: write # sign the provenance (Sigstore, keyless)
  attestations: write # store it with the repository

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.20.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed build provenance for every archive in checksums.txt: this
      # workflow built them from the tagged commit.
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # GoReleaser leaves the release a draft; it goes public only with its
      # provenance attached, so the latest release always has one.
      - name: attach the provenance and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" provenance.json
          gh release upload "$GITHUB_REF_NAME" provenance.json --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
