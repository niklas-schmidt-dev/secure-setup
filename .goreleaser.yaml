# Release pipeline. Runs in GitHub Actions on every v* tag (.github/workflows/release.yml).
version: 2

project_name: secure-setup

builds:
  - id: secure-setup
    main: .
    binary: secure-setup
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    # No version in the name so install.sh can use the releases/latest/download URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - install.sh
      - examples/cloud-init.yaml
      # Keep the README's relative documentation and image links usable.
      - docs/*.md
      - docs/assets/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# GitHub's generated notes: one line per merged pull request.
changelog:
  use: github-native

release:
  github:
    owner: niklas-schmidt-dev
    name: secure-setup
  prerelease: auto
  # The release workflow publishes it once the provenance is attached.
  draft: true
